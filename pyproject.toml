[project]
name = "lifeos"
version = "0.1.0"
description = "LifeOS sync engine: pulls school, calendar, email, Slack, and Shopify data into an Obsidian vault."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "httpx>=0.27",
    "python-frontmatter>=1.1",
    "keyring>=25.2",
    "icalendar>=5.0",
    "caldav>=1.3",
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
    "msal>=1.28",
    "slack_sdk>=3.27",
]

[project.scripts]
lifeos = "lifeos.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lifeos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
